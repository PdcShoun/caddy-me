name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - '**/Dockerfile'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy version to build'
        required: false
        default: '2.11'
        type: string

env:
  CADDY_VERSION: ${{ github.event.inputs.caddy_version || '2.11' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.changes.outputs.folders }}
      count: ${{ steps.changes.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed folders
        id: changes
        run: |
          # Get all folders containing Dockerfiles
          folders_with_dockerfiles=$(find . -name "Dockerfile" -not -path "./.github/*" | sed 's|/Dockerfile||' | sed 's|^\./||' | sort)

          # Get changed files compared to main branch
          if [ "$GITHUB_REF" == "refs/heads/main" ]; then
            # For push to main, compare with previous commit
            changed_files=$(git diff --name-only HEAD~1 HEAD)
          else
            # For PR, compare with main
            changed_files=$(git diff --name-only origin/main...HEAD)
          fi

          # Find folders with Dockerfile changes
          changed_folders=""
          count=0
          for folder in $folders_with_dockerfiles; do
            if echo "$changed_files" | grep -q "^${folder}/"; then
              if [ -z "$changed_folders" ]; then
                changed_folders="\"$folder\""
              else
                changed_folders="$changed_folders, \"$folder\""
              fi
              count=$((count + 1))
            fi
          done

          # If workflow file changed, build all folders
          if echo "$changed_files" | grep -q "^\.github/workflows/docker-build.yml"; then
            changed_folders=""
            count=0
            for folder in $folders_with_dockerfiles; do
              if [ -z "$changed_folders" ]; then
                changed_folders="\"$folder\""
              else
                changed_folders="$changed_folders, \"$folder\""
              fi
              count=$((count + 1))
            done
          fi

          echo "folders=[$changed_folders]" >> $GITHUB_OUTPUT
          echo "count=$count" >> $GITHUB_OUTPUT

          echo "Changed folders: [$changed_folders]"
          echo "Count: $count"

      - name: Skip if no changes
        if: steps.changes.outputs.count == 0
        run: |
          echo "No Dockerfile changes detected. Skipping build."
          echo "folders=[]" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.count != '0'
    strategy:
      matrix:
        folder: ${{ fromJSON(needs.detect-changes.outputs.folders) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set image name
        id: image
        run: |
          if [ "${{ matrix.folder }}" == "caddy" ]; then
            echo "suffix=" >> $GITHUB_OUTPUT
          else
            echo "suffix=-${{ matrix.folder }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.folder }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.folder }}
          file: ${{ matrix.folder }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CADDY_VERSION=${{ env.CADDY_VERSION }}
          tags: |
            shounnnn/caddy${{ steps.image.outputs.suffix }}:latest
            shounnnn/caddy${{ steps.image.outputs.suffix }}:main
            shounnnn/caddy${{ steps.image.outputs.suffix }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=registry,ref=shounnnn/caddy${{ steps.image.outputs.suffix }}:buildcache
          cache-to: type=registry,ref=shounnnn/caddy${{ steps.image.outputs.suffix }}:buildcache,mode=max
