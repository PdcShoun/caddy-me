services:
  caddy:
    image: shounnnnn/caddy:dev
    
    ports:
      - 80:80
      - 443:443
    volumes:
      - caddy-data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile
    environment:
      - DUCKDNS_API_TOKEN={{ REPLACE_WITH_DUCKDNS_API_TOKEN }}
    restart: unless-stopped

volumes:
  caddy-data:
